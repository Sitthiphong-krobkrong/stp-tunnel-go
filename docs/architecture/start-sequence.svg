<svg width="960" height="700" viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans Thai', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="14" width="18" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="7" cy="7" r="0.9" fill="currentColor"/>
      <circle cx="7" cy="17" r="0.9" fill="currentColor"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">SEQUENCE FLOW &#183; กดปุ่ม START</text>
  <text x="40" y="60" font-size="22" font-weight="700" fill="#0F172A">STP Tunnel &#8212; จาก click ถึง traffic ไหลผ่าน tunnel</text>

  <!-- lifeline headers -->
  <!-- User -->
  <rect x="60" y="90" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-user" x="76" y="104" width="20" height="20" color="#2563EB"/>
  <text x="104" y="126" font-size="13" font-weight="600" fill="#0F172A">User</text>
  <line x1="130" y1="150" x2="130" y2="640" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- main.go -->
  <rect x="290" y="90" width="170" height="60" rx="10" fill="#1E40AF" filter="url(#softShadow)"/>
  <use href="#icon-gear" x="306" y="104" width="20" height="20" color="#FFFFFF"/>
  <text x="334" y="122" font-size="13" font-weight="600" fill="#FFFFFF" font-family="'DejaVu Sans Mono', monospace">main.go</text>
  <text x="306" y="138" font-size="10.5" fill="#DBEAFE">App (UI thread)</text>
  <line x1="375" y1="150" x2="375" y2="640" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- tunnel.go -->
  <rect x="560" y="90" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#softShadow)"/>
  <use href="#icon-server" x="576" y="104" width="20" height="20" color="#2563EB"/>
  <text x="604" y="122" font-size="13" font-weight="600" fill="#0F172A" font-family="'DejaVu Sans Mono', monospace">tunnel.go</text>
  <text x="576" y="138" font-size="10.5" fill="#64748B">TunnelRuntime (goroutine)</text>
  <line x1="655" y1="150" x2="655" y2="640" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bastion -->
  <rect x="820" y="90" width="120" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="840" y="118" font-size="13" font-weight="600" fill="#0F172A">Bastion</text>
  <text x="836" y="136" font-size="10.5" fill="#64748B">SSH server</text>
  <line x1="880" y1="150" x2="880" y2="640" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- step 1: User -> main.go -->
  <line x1="130" y1="185" x2="375" y2="185" stroke="#0F172A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="150" y="167" width="230" height="18" rx="9" fill="#FFFFFF"/>
  <text x="152" y="180" font-size="11.5" fill="#0F172A">1. คลิก &#8220;Start&#8221; (tunnel ที่ติ๊กไว้)</text>
  <text x="150" y="196" font-size="10" fill="#94A3B8" font-family="'DejaVu Sans Mono', monospace">doStartSelected()</text>

  <!-- step 2: main.go -> tunnel.go -->
  <line x1="375" y1="228" x2="655" y2="228" stroke="#0F172A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="400" y="210" width="230" height="18" rx="9" fill="#FFFFFF"/>
  <text x="400" y="223" font-size="11.5" fill="#0F172A">2. ต่อ tunnel นี้ (ทีละตัว ใน goroutine)</text>
  <text x="400" y="239" font-size="10" fill="#94A3B8" font-family="'DejaVu Sans Mono', monospace">runtime.Start(t, project, auth)</text>

  <!-- step 3: tunnel.go -> Bastion -->
  <line x1="655" y1="271" x2="880" y2="271" stroke="#0F172A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="670" y="253" width="200" height="18" rx="9" fill="#FFFFFF"/>
  <text x="670" y="266" font-size="11.5" fill="#0F172A">3. เปิด SSH session</text>
  <text x="670" y="282" font-size="10" fill="#94A3B8" font-family="'DejaVu Sans Mono', monospace">ssh.Dial() + host key check</text>

  <!-- step 4: Bastion --> tunnel.go (dashed return) -->
  <line x1="880" y1="312" x2="655" y2="312" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowReturn)"/>
  <rect x="690" y="294" width="180" height="18" rx="9" fill="#FFFFFF"/>
  <text x="880" y="307" font-size="11.5" fill="#1E40AF" text-anchor="end">4. session พร้อม (*ssh.Client)</text>

  <!-- note: local listener + goroutines -->
  <rect x="560" y="336" width="190" height="98" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="576" y="356" font-size="11" font-weight="600" fill="#0F172A">5. เปิด local port</text>
  <text x="576" y="371" font-size="10" fill="#64748B" font-family="'DejaVu Sans Mono', monospace">net.Listen(localhost:LocalPort)</text>
  <text x="576" y="390" font-size="10.5" fill="#0F172A">spawn 3 goroutine:</text>
  <text x="584" y="404" font-size="10" fill="#64748B">&#8226; acceptLoop (proxy traffic)</text>
  <text x="584" y="417" font-size="10" fill="#64748B">&#8226; pingLoop (latency)</text>
  <text x="584" y="430" font-size="10" fill="#64748B">&#8226; client.Wait() (เฝ้า session)</text>

  <!-- back to main.go: RUNNING -->
  <line x1="655" y1="460" x2="375" y2="460" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowReturn)"/>
  <rect x="400" y="442" width="230" height="18" rx="9" fill="#FFFFFF"/>
  <text x="655" y="455" font-size="11.5" fill="#1E40AF" text-anchor="end">6. คืนค่าสำเร็จ &#8594; สถานะ RUNNING</text>

  <!-- divider: time passes -->
  <line x1="60" y1="500" x2="940" y2="500" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="380" y="490" width="220" height="20" rx="10" fill="#FFFFFF"/>
  <text x="490" y="504" font-size="11" fill="#94A3B8" text-anchor="middle">&#8212; เวลาผ่านไป (background) &#8212;</text>

  <!-- step 7: unexpected drop -->
  <line x1="880" y1="546" x2="655" y2="546" stroke="#0F172A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="680" y="528" width="190" height="18" rx="9" fill="#FFFFFF"/>
  <text x="875" y="541" font-size="11.5" fill="#0F172A" text-anchor="end">7. session หลุด (เน็ตขาด/restart)</text>

  <!-- step 8: tunnel.go -> main.go callback -->
  <line x1="655" y1="588" x2="375" y2="588" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowReturn)"/>
  <rect x="390" y="562" width="260" height="18" rx="9" fill="#FFFFFF"/>
  <text x="650" y="575" font-size="11.5" fill="#1E40AF" text-anchor="end">8. callback: goroutine ที่เฝ้า client.Wait()</text>
  <text x="390" y="600" font-size="10" fill="#94A3B8" font-family="'DejaVu Sans Mono', monospace">onExit(tunnelID, err)</text>

  <!-- step 9: main.go self -->
  <rect x="390" y="610" width="270" height="24" rx="8" fill="#DBEAFE"/>
  <text x="405" y="626" font-size="10.5" fill="#1E40AF" font-weight="600">9. fyne.Do(refreshRows) &#8212; กลับ UI thread</text>

  <text x="40" y="672" font-size="10.5" fill="#94A3B8">* ขั้น 7&#8211;9 รันบน goroutine แยกจาก UI &#8212; เทียบ instance เดิมก่อนแจ้ง onExit กันแจ้งผิดตัว</text>
  <text x="40" y="688" font-size="10.5" fill="#94A3B8">เวลา Stop() แล้ว Start() ตัวเดิมซ้อนกันเร็วมาก (ดู comment ใน tunnel.go)</text>
</svg>
